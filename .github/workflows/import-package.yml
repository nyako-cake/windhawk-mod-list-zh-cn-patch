name: import-package

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download package files
        run: |
          set -euo pipefail
          mkdir -p package
          curl -fsSL "https://aka.doubaocdn.com/s/pPVrg28SS6" -o "package/windhawk-zh-cn.js"
          curl -fsSL "https://aka.doubaocdn.com/s/GJtDuXIijX" -o "package/install.ps1"
          curl -fsSL "https://aka.doubaocdn.com/s/wx8fT2vD3U" -o "package/uninstall.ps1"
          curl -fsSL "https://aka.doubaocdn.com/s/bKWTXDO0Lw" -o "package/一键安装.bat"
          curl -fsSL "https://aka.doubaocdn.com/s/g9UqNIuGMV" -o "package/一键卸载.bat"
          curl -fsSL "https://aka.doubaocdn.com/s/Uf05I9mEaq" -o "package/使用说明.txt"
          curl -fsSL "https://aka.doubaocdn.com/s/RKoVygtB53" -o "Windhawk-patch-v1.0.27.zip"
          sha256sum package/* Windhawk-patch-v1.0.27.zip > SHA256SUMS.txt
          ls -la package

      - name: Commit imported files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: 导入 v1.0.27 安装包与脚本"
            git push
          fi
