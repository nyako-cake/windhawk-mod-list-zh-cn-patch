name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 发布 v1.0.27 完整包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          {
            set -x
            R="${{ github.repository }}"

            echo "== 清掉残留草稿 =="
            ids=$(gh api "repos/$R/releases" --jq '.[] | select(.draft == true) | .id' || true)
            for id in $ids; do
              echo "delete draft $id"
              gh api -X DELETE "repos/$R/releases/$id" || true
            done

            echo "== 建草稿 =="
            resp=$(gh api -X POST "repos/$R/releases" \
              -f tag_name="v1.0.27" \
              -F draft=true \
              -f name="Windhawk 汉化补丁 v1.0.27" \
              -f body="$(cat RELEASE_NOTES_v1.0.27.md)")
            rid=$(echo "$resp" | jq -r .id)
            echo "release id=$rid"

            upload() {
              f="$1"
              n=$(basename "$f")
              enc=$(jq -rn --arg n "$n" '$n|@uri')
              echo "upload $n -> $rid"
              gh api -X POST \
                "https://uploads.github.com/repos/$R/releases/$rid/assets?name=$enc" \
                -H "Content-Type: application/octet-stream" \
                --input "$f" > /tmp/asset.json
              jq -r '.name + " (" + (.size|tostring) + " bytes)"' /tmp/asset.json
            }

            upload "Windhawk-patch-v1.0.27.zip"
            upload "SHA256SUMS.txt"

            echo "== 正式发布 =="
            gh api -X PATCH "repos/$R/releases/$rid" -F draft=false > /tmp/rel.json
            jq -r '.html_url, .tag_name, (.draft|tostring), (.published_at|tostring)' /tmp/rel.json
            echo "== done =="
          } 2>&1 | tee /tmp/publish.log

      - name: 失败时把日志存成 Issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "发布失败日志（Actions 自动记录）" \
            --body "$(tail -c 60000 /tmp/publish.log 2>/dev/null || echo no-log)" || true
