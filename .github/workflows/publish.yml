name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 建草稿、上传附件、再正式发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          {
            set -x
            R="${{ github.repository }}"
            echo "== clean stray drafts =="
            ids=$(gh api "repos/$R/releases" --jq '.[] | select(.draft == true) | .id' || true)
            for id in $ids; do
              echo "delete draft $id"
              gh api -X DELETE "repos/$R/releases/$id" || true
            done
            echo "== create draft release on existing tag =="
            gh api -X POST "repos/$R/releases" \
              -f tag_name="v1.0.27" \
              -F draft=true \
              -f name="Windhawk 汉化补丁 v1.0.27" \
              -f body="$(cat RELEASE_NOTES_v1.0.27.md)"
            echo "== upload assets =="
            gh release upload v1.0.27 --clobber \
              "Windhawk-patch-v1.0.27.zip" \
              "package/windhawk-zh-cn.js" \
              "package/install.ps1" \
              "package/uninstall.ps1" \
              "package/一键安装.bat" \
              "package/一键卸载.bat" \
              "package/使用说明.txt" \
              "SHA256SUMS.txt"
            echo "== publish =="
            gh release edit v1.0.27 --draft=false
            echo "== done =="
          } 2>&1 | tee /tmp/publish.log

      - name: 失败时把日志存成 Issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "发布失败日志（Actions 自动记录）" \
            --body "$(tail -c 60000 /tmp/publish.log 2>/dev/null || echo no-log)" || true
